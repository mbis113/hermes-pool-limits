name: pool-limits
version: 1.2.0
description: "Remaining model quota next to the Hermes Desktop model picker: every account of a CLIProxyAPI pool (Codex + Claude + GLM/Zhipu + Kimi API-key subscriptions) and the backend's own Codex accounts. The chip follows the selected model's family; a manually picked GLM subscription (alias …-A) shows that subscription's own 5-hour window. Read-only."
